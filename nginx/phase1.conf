# ─────────────────────────────────────────────────────────────────────────────
# nginx/phase1.conf
# Phase 1 — Private Network Service Platform
#
# This is the nginx reverse-proxy / HTTPS / load-balancer config for Mac 2.
#
# Deploy steps (Mac 2):
#   1. Copy this file to the nginx configuration directory, e.g.:
#        sudo cp phase1.conf /opt/homebrew/etc/nginx/servers/phase1.conf
#        OR
#        sudo cp phase1.conf /usr/local/etc/nginx/servers/phase1.conf
#   2. Set the correct ssl_certificate and ssl_certificate_key paths below.
#   3. Run:  nginx -t
#   4. Run:  brew services restart nginx
#            OR  sudo nginx -s reload
#
# IMPORTANT — private key:
#   The ssl_certificate_key file MUST NOT be committed to this repository.
#   It lives only on Mac 2 at the path shown below (adjusted to your username).
#
# IMPORTANT — backend IPs:
#   10.7.15.60  = Mac 1 (Backend A) — current lab DHCP address
#   10.7.21.116 = Mac 2 (Backend B) — current lab DHCP address
#   Update if DHCP reassigns addresses.
# ─────────────────────────────────────────────────────────────────────────────

upstream backends {
    # Mac 1 — Backend A (Python, port 3001)
    server 10.7.15.60:3001;

    # Mac 2 — Backend B (Python, port 3002)
    server 10.7.21.116:3002;
}

server {
    listen 8443 ssl;
    server_name app.teamX.test;

    # ── TLS — paths are machine-specific; adjust USERNAME ─────────────────────
    # The private key (app.key) must NEVER be committed to the repository.
    ssl_certificate     /Users/USERNAME/cn-project/nginx/ssl/app.crt;
    ssl_certificate_key /Users/USERNAME/cn-project/nginx/ssl/app.key;

    # ── Proxy to round-robin upstream pool ───────────────────────────────────
    location / {
        proxy_pass http://backends;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    }
}
