# ─────────────────────────────────────────────────────────────
# nginx/app.conf
# Phase 1 — Private Network Service Platform
#
# This file is the Nginx virtual-host / reverse-proxy config.
# It is meant to be placed (or symlinked) at:
#   /etc/nginx/sites-available/app.conf
# and enabled with:
#   sudo ln -s /etc/nginx/sites-available/app.conf \
#              /etc/nginx/sites-enabled/app.conf
#
# IMPORTANT — SSL paths:
#   ssl_certificate and ssl_certificate_key point to files that
#   live only on VM3 (the Nginx VM).  Do NOT commit the actual
#   .crt / .key files to this repository.
#
# IMPORTANT — Backend IPs:
#   The IPs below are current lab addresses.  They may change
#   under DHCP / UTM networking.  Update them before reloading
#   Nginx if the VMs get new addresses.
# ─────────────────────────────────────────────────────────────

# ── Upstream load-balancer pool ───────────────────────────────
# Both backends are included.  Nginx will round-robin between
# them.  See nginx/README.md for the current connectivity status.
upstream backends {
    # VM2 — Backend A (Python)  — current lab IP
    server 10.7.24.122:3001;

    # VM4 — Backend B (Node.js) — current lab IP
    # NOTE: direct VM3 → VM4 connectivity has been unreliable
    #       in the current UTM setup (different network segment).
    #       See README.md → "Current Known Limitation".
    server 10.7.21.116:3002;
}

# ── HTTPS virtual host ────────────────────────────────────────
server {
    listen 443 ssl;
    server_name app.teamX.test;

    # ── TLS — files exist only on VM3, not in this repo ───────
    ssl_certificate     /etc/nginx/ssl/app.crt;
    ssl_certificate_key /etc/nginx/ssl/app.key;

    # ── Proxy to upstream pool ─────────────────────────────────
    location / {
        proxy_pass http://backends;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
