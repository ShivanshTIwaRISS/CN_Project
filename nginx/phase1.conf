# ─────────────────────────────────────────────────────────────────────────────
# nginx/phase1.conf
# Phase 1 — Private Network Service Platform
#
# This is the nginx reverse-proxy / HTTPS / load-balancer config for Mac 2.
#
# Deploy steps (Mac 2):
#   1. Copy this file to the nginx configuration directory, e.g.:
#        sudo cp phase1.conf /opt/homebrew/etc/nginx/servers/phase1.conf
#        OR
#        sudo cp phase1.conf /usr/local/etc/nginx/servers/phase1.conf
#   2. Set the correct ssl_certificate and ssl_certificate_key paths below.
#   3. Run:  nginx -t
#   4. Run:  brew services restart nginx
#            OR  sudo nginx -s reload
#
# IMPORTANT — private key:
#   The ssl_certificate_key file MUST NOT be committed to this repository.
#
# Lab IPs:
#   10.7.19.246 = Mac 1 (Backend A)
#   10.7.18.254 = Mac 2 (Backend B)
# ─────────────────────────────────────────────────────────────────────────────

upstream backends {
    # Mac 1 — Backend A (port 3001)
    server 10.7.19.246:3001;

    # Mac 2 — Backend B (port 3002)
    server 10.7.18.254:3002;
}

server {
    listen 8443 ssl;
    server_name app.team1.test api.team1.test;

    # ── TLS — paths are machine-specific; adjust path to certificate files ────
    # The private key must NEVER be committed to the repository.
    ssl_certificate     /Users/USERNAME/cn-project/certs/edge-cert.pem;
    ssl_certificate_key /Users/USERNAME/cn-project/certs/edge-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # ── Proxy to round-robin upstream pool ───────────────────────────────────
    location / {
        proxy_pass http://backends;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    }
}
